[project]
name = "optimizer-vis"
version = "2.0.0"
description = "A PyTorch optimizer visualization and trajectory scoring library."
readme = "README.md"
authors = [
    { name = "AidinHamedi", email = "aidin.hamediasl@gmail.com" }
]
requires-python = ">=3.12"

# 1. Standard Dependencies
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.26.0",
]

# 2. Optional Dev Tools
[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "basedpyright>=1.0.0",
    "pytest>=8.0.0",
]

# 3. UV Specific Index for PyTorch CPU
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" }
]

# 4. Ruff Configuration
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = ["E501"]

# 5. Basedpyright Configuration
[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
exclude = ["tests"]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
